# Weekly update PRs for every pinned input: Go modules, the frontend's npm
# packages, the GitHub Actions and the Dockerfile's base image digests.
# Minor and patch updates are grouped so they arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node: the LTS line is chosen by hand. Go: a new minor or major comes
      # with a go.mod bump, which test-pins.sh requires to match.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
