# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart. GOTREE_AUDIT adds the dependency audits
# (govulncheck, npm audit), which need the network and change with every new
# advisory, so they run here and nightly rather than before every local push.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The same Go as the release and the Docker image: the one go.mod names.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('go.sum') != '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: ./run-tests.sh
        env:
          GOTREE_AUDIT: "1"
          GOTREE_RACE: "1"
